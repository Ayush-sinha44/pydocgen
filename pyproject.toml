[project]
name = "pydocgen"
version = "0.1.0"
description = "Automatic Python docstring generation utility"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Anubhav Sharma" }
]
dependencies = [
    "black>=26.3.1",
    "requests>=2.33.1",
    "winloop>=0.6.3",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]